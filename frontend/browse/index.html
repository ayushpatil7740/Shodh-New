<!-- This page allows users to browse, search, and filter all lost and found items -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Catalog | Lost &amp; Found</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="site-nav">
    <div class="container nav-container">
      <a href="../home/index.html" class="brand-logo">
        <div class="brand-icon">🧭</div>
        <span>Lost <span>&amp;</span> Found</span>
      </a>

      <button class="mobile-menu-btn" aria-label="Toggle navigation menu">&#9776;</button>

      <ul class="nav-links">
        <li><a href="../home/index.html" class="nav-link">Home</a></li>
        <li><a href="../browse/index.html" class="nav-link active">Browse Items</a></li>
        <li><a href="../login/index.html" class="nav-link">Admin / Login</a></li>
      </ul>

      <div class="nav-actions">
        <a href="../report-lost/index.html" class="btn-lost-sm">I Lost Something</a>
        <a href="../report-found/index.html" class="btn-found-sm">I Found Something</a>
      </div>
    </div>
  </nav>

  <!-- Search & Filter Controls -->
  <main class="section">
    <div class="container">
      <div class="section-header">
        <div>
          <div class="section-subtitle">Campus Catalog</div>
          <h1 class="section-title">Browse Lost &amp; Found Items</h1>
        </div>
        <div id="items-count" style="font-size: 0.9rem; font-weight: 700; color: var(--slate-500);">
          Loading items...
        </div>
      </div>

      <!-- Quick Search Bar -->
      <div style="margin-bottom: 20px;">
        <form id="browse-search-form" class="search-form">
          <span class="search-icon-left">&#128269;</span>
          <input
            type="text"
            id="browse-search-input"
            class="search-input"
            placeholder="Search items by name, description, location, or keywords..."
          >
          <button type="submit" class="search-btn">Search</button>
        </form>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <div class="filter-top-row">
          <div class="type-filter-group">
            <button type="button" class="type-filter-btn active" data-type="all">All Items</button>
            <button type="button" class="type-filter-btn" data-type="lost">Lost Items</button>
            <button type="button" class="type-filter-btn" data-type="found">Found Items</button>
          </div>

          <button type="button" id="btn-reset" class="btn-reset-filters">
            &#8634; Reset all filters
          </button>
        </div>

        <div class="filter-controls-row">
          <div class="filter-control">
            <label for="filter-category">Category</label>
            <select id="filter-category" class="filter-select">
              <option value="all">All Categories</option>
              <option value="Mobile Phone">Mobile Phone</option>
              <option value="Wallet">Wallet</option>
              <option value="ID Card">ID Card</option>
              <option value="Keys">Keys</option>
              <option value="Bag">Bag</option>
              <option value="Laptop">Laptop</option>
              <option value="Earphones">Earphones</option>
              <option value="Watch">Watch</option>
              <option value="Documents">Documents</option>
              <option value="Jewelry">Jewelry</option>
              <option value="Clothing">Clothing</option>
              <option value="Books">Books</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-control">
            <label for="filter-location">Location</label>
            <input type="text" id="filter-location" class="filter-input" placeholder="e.g. Library, Cafeteria, Gym...">
          </div>

          <div class="filter-control">
            <label for="filter-sort">Sort By</label>
            <select id="filter-sort" class="filter-select">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Catalog Items Grid -->
      <div id="browse-items-grid" class="items-grid">
        <!-- Populated dynamically via browse.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 Lost &amp; Found System. Academic demonstration project.</div>
        <div><a href="../home/index.html">Return to Home</a></div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/browse.js"></script>
</body>
</html>
